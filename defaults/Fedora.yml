---

# Python2
python2: false
python2_command: /usr/bin/python2
python2_virtualenv: /usr/bin/virtualenv
python2_packages:
  - python2
  - python2-libs
  - python2-devel
  - python2-pip
  - python2-virtualenv
  - libselinux-python
python2_packages_optional:
  - gcc
  - glibc-devel
  - openssl-devel

# Python3
python3: true
python3_command: /usr/bin/python3
python3_virtualenv: /usr/bin/virtualenv
python3_packages:
  - python3
  - python3-libs
  - python3-pip
  - python3-virtualenv
  - python3-libselinux
python3_packages_optional:
  - gcc
  - python3-devel
  - glibc-devel
  - openssl-devel
  - libffi-devel

# Python 3.8
python38: false
python38_command: /usr/bin/python3.8
